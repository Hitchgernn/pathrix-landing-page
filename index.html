<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--lang-detect-->
    <title>Pathrix: AI Agent WebGIS for Multimodal Navigation in Yogyakarta</title>
    <meta
      name="description"
      content="Pathrix is a WebGIS-based AI agent that builds multimodal routes across Yogyakarta, from walking, andong/becak, TransJogja, and KRL, to the KA Bandara YIA airport rail, all from one plain-language request."
    />
    <meta name="theme-color" content="#dfeaf3" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <!--hreflang-links-->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <!--
      Load the webfont stylesheet without blocking first paint: fetch it as a
      preload, then promote it to a stylesheet once it arrives. font-display:swap
      means text is readable in the fallback face until it lands. The <noscript>
      copy keeps it working with JavaScript disabled.
    -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      onload="this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      />
    </noscript>
    <link
      rel="preload"
      href="/fonts/Quarkiz.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Pathrix: Multimodal Navigation for Yogyakarta" />
    <meta
      property="og:description"
      content="AI Agent for Multimodal Mobility Navigation in Yogyakarta. MAPID WebGIS Competition 2026."
    />
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
