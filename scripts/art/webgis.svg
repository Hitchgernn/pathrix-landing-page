<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Archivo, DejaVu Sans, sans-serif">
  <!--
    Placeholder mockup of the Pathrix WebGIS product screen. Illustrative only —
    replace with a real screenshot when the product is shippable. Palette matches
    src/styles/tokens.css so it sits inside the Fitur section without clashing.
    Deliberately contains no statistics or invented metrics: labels only.
  -->
  <defs>
    <linearGradient id="mapbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16283a" />
      <stop offset="1" stop-color="#0f1f2c" />
    </linearGradient>
    <linearGradient id="walkband" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5aa9dd" stop-opacity=".55" />
      <stop offset="1" stop-color="#5aa9dd" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="focus" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#c2603a" stop-opacity=".55" />
      <stop offset="1" stop-color="#c2603a" stop-opacity="0" />
    </radialGradient>
    <clipPath id="mapclip"><rect x="286" y="86" width="1030" height="768" /></clipPath>
  </defs>

  <rect width="1600" height="900" fill="#0c1822" />

  <!-- top bar -->
  <rect x="0" y="0" width="1600" height="66" fill="#101e2a" />
  <line x1="0" y1="66" x2="1600" y2="66" stroke="#e7f0f7" stroke-opacity=".14" />
  <text x="34" y="41" fill="#f2f7fb" font-size="19" letter-spacing="3.4">PATHRIX</text>
  <text x="182" y="41" fill="#5aa9dd" font-size="13" letter-spacing="2.6" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace">WEBGIS</text>
  <g fill="#e7f0f7" fill-opacity=".62" font-size="13" letter-spacing="1.2">
    <text x="470" y="41">Peta</text>
    <text x="546" y="41">Simpul</text>
    <text x="640" y="41">Walkability</text>
    <text x="762" y="41">Laporan</text>
  </g>
  <rect x="1320" y="17" width="120" height="32" rx="16" fill="#1f6592" />
  <text x="1380" y="38" fill="#f0f6fb" font-size="12" text-anchor="middle" letter-spacing="1">Ekspor</text>
  <circle cx="1500" cy="33" r="15" fill="#5aa9dd" fill-opacity=".28" />
  <circle cx="1500" cy="33" r="15" stroke="#5aa9dd" stroke-opacity=".5" fill="none" />

  <!-- left rail: layers -->
  <rect x="0" y="66" width="286" height="834" fill="#101e2a" />
  <line x1="286" y1="66" x2="286" y2="900" stroke="#e7f0f7" stroke-opacity=".14" />
  <text x="26" y="112" fill="#e7f0f7" fill-opacity=".45" font-size="11" letter-spacing="2.6" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace">LAPISAN</text>

  <g font-size="13.5" fill="#e7f0f7">
    <!-- each row: pill toggle + label -->
    <g transform="translate(26,140)">
      <rect width="34" height="18" rx="9" fill="#5aa9dd" /><circle cx="25" cy="9" r="7" fill="#101e2a" />
      <text x="48" y="14" fill-opacity=".9">Trans Jogja</text>
    </g>
    <g transform="translate(26,180)">
      <rect width="34" height="18" rx="9" fill="#5aa9dd" /><circle cx="25" cy="9" r="7" fill="#101e2a" />
      <text x="48" y="14" fill-opacity=".9">Jalur kereta</text>
    </g>
    <g transform="translate(26,220)">
      <rect width="34" height="18" rx="9" fill="#5aa9dd" /><circle cx="25" cy="9" r="7" fill="#101e2a" />
      <text x="48" y="14" fill-opacity=".9">Simpul antarmoda</text>
    </g>
    <g transform="translate(26,260)">
      <rect width="34" height="18" rx="9" fill="#e7f0f7" fill-opacity=".2" /><circle cx="9" cy="9" r="7" fill="#e7f0f7" fill-opacity=".45" />
      <text x="48" y="14" fill-opacity=".5">Terminal bus</text>
    </g>
    <g transform="translate(26,300)">
      <rect width="34" height="18" rx="9" fill="#5aa9dd" /><circle cx="25" cy="9" r="7" fill="#101e2a" />
      <text x="48" y="14" fill-opacity=".9">Jangkauan jalan kaki</text>
    </g>
    <g transform="translate(26,340)">
      <rect width="34" height="18" rx="9" fill="#c2603a" /><circle cx="25" cy="9" r="7" fill="#101e2a" />
      <text x="48" y="14" fill-opacity=".9">Prioritas perbaikan</text>
    </g>
    <g transform="translate(26,380)">
      <rect width="34" height="18" rx="9" fill="#e7f0f7" fill-opacity=".2" /><circle cx="9" cy="9" r="7" fill="#e7f0f7" fill-opacity=".45" />
      <text x="48" y="14" fill-opacity=".5">Sentimen warga</text>
    </g>
  </g>

  <line x1="26" y1="424" x2="260" y2="424" stroke="#e7f0f7" stroke-opacity=".14" />

  <!-- natural language query box -->
  <text x="26" y="462" fill="#e7f0f7" fill-opacity=".45" font-size="11" letter-spacing="2.6" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace">TANYA PATHRIX</text>
  <rect x="26" y="478" width="234" height="86" rx="10" fill="#17293a" stroke="#5aa9dd" stroke-opacity=".45" />
  <text x="40" y="504" fill="#e7f0f7" fill-opacity=".82" font-size="12.5">Halte mana yang paling sulit</text>
  <text x="40" y="524" fill="#e7f0f7" fill-opacity=".82" font-size="12.5">dijangkau pejalan kaki?</text>
  <rect x="40" y="536" width="2" height="14" fill="#5aa9dd" />
  <rect x="26" y="578" width="234" height="34" rx="17" fill="#1f6592" />
  <text x="143" y="600" fill="#f0f6fb" font-size="12.5" text-anchor="middle" letter-spacing=".8">Jawab di peta</text>

  <!-- legend -->
  <text x="26" y="668" fill="#e7f0f7" fill-opacity=".45" font-size="11" letter-spacing="2.6" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace">LEGENDA</text>
  <g font-size="12.5" fill="#e7f0f7" fill-opacity=".7">
    <circle cx="34" cy="694" r="6" fill="#5aa9dd" /><text x="50" y="699">Simpul terlayani baik</text>
    <circle cx="34" cy="722" r="6" fill="#d2704a" /><text x="50" y="727">Perlu perhatian</text>
    <circle cx="34" cy="750" r="6" fill="#c2603a" /><text x="50" y="755">Prioritas utama</text>
    <rect x="28" y="772" width="12" height="12" fill="#5aa9dd" fill-opacity=".3" /><text x="50" y="783">Isokron jalan kaki</text>
  </g>

  <!-- map canvas -->
  <g clip-path="url(#mapclip)">
    <rect x="286" y="86" width="1030" height="768" fill="url(#mapbg)" />

    <!-- graticule -->
    <g stroke="#e7f0f7" stroke-opacity=".05">
      <path d="M386 86V854M486 86V854M586 86V854M686 86V854M786 86V854M886 86V854M986 86V854M1086 86V854M1186 86V854M1286 86V854" />
      <path d="M286 176h1030M286 266h1030M286 356h1030M286 446h1030M286 536h1030M286 626h1030M286 716h1030M286 806h1030" />
    </g>

    <!-- river -->
    <path d="M980 86c-26 120 34 210-6 300-42 96 24 178-14 268" stroke="#2f6f96" stroke-opacity=".5" stroke-width="16" fill="none" stroke-linecap="round" />

    <!-- blocks -->
    <g fill="#e7f0f7" fill-opacity=".05">
      <rect x="360" y="150" width="150" height="110" rx="4" /><rect x="540" y="150" width="190" height="110" rx="4" />
      <rect x="360" y="300" width="150" height="140" rx="4" /><rect x="540" y="300" width="190" height="140" rx="4" />
      <rect x="360" y="480" width="150" height="120" rx="4" /><rect x="540" y="480" width="190" height="120" rx="4" />
      <rect x="360" y="640" width="150" height="130" rx="4" /><rect x="540" y="640" width="190" height="130" rx="4" />
      <rect x="770" y="150" width="170" height="110" rx="4" /><rect x="770" y="300" width="170" height="140" rx="4" />
      <rect x="770" y="480" width="170" height="120" rx="4" /><rect x="770" y="640" width="170" height="130" rx="4" />
      <rect x="1050" y="150" width="200" height="150" rx="4" /><rect x="1050" y="340" width="200" height="160" rx="4" />
      <rect x="1050" y="540" width="200" height="140" rx="4" />
    </g>

    <!-- walkable reach band around the focused node -->
    <circle cx="770" cy="470" r="196" fill="url(#walkband)" />
    <circle cx="770" cy="470" r="196" stroke="#5aa9dd" stroke-opacity=".35" stroke-dasharray="7 9" fill="none" />
    <circle cx="770" cy="470" r="120" stroke="#5aa9dd" stroke-opacity=".45" stroke-dasharray="5 7" fill="none" />

    <!-- road grid -->
    <g stroke="#e7f0f7" stroke-opacity=".2" stroke-width="7" stroke-linecap="round">
      <path d="M300 282h1000M300 462h1000M300 622h1000" />
      <path d="M526 100V840M756 100V840M1020 100V840" />
    </g>

    <!-- rail line -->
    <g>
      <path d="M300 210h1000" stroke="#e7f0f7" stroke-opacity=".38" stroke-width="5" />
      <path d="M300 210h1000" stroke="#0c1822" stroke-opacity=".8" stroke-width="1.6" stroke-dasharray="11 11" />
    </g>

    <!-- bus corridor -->
    <path d="M330 700c150 0 190-120 330-120s250 96 420 24" stroke="#5aa9dd" stroke-opacity=".75" stroke-width="5" fill="none" stroke-linecap="round" />

    <!-- priority hotspot -->
    <circle cx="1120" cy="640" r="94" fill="url(#focus)" />

    <!-- nodes -->
    <g>
      <!-- good nodes -->
      <g fill="#5aa9dd" stroke="#0c1822" stroke-width="3">
        <circle cx="526" cy="210" r="10" /><circle cx="1020" cy="210" r="10" />
        <circle cx="526" cy="462" r="10" /><circle cx="1020" cy="282" r="10" />
        <circle cx="330" cy="700" r="10" /><circle cx="756" cy="282" r="10" />
      </g>
      <!-- attention -->
      <g fill="#d2704a" stroke="#0c1822" stroke-width="3">
        <circle cx="756" cy="622" r="10" /><circle cx="1020" cy="462" r="10" />
      </g>
      <!-- priority -->
      <circle cx="1120" cy="640" r="13" fill="#c2603a" stroke="#0c1822" stroke-width="3" />

      <!-- focused station -->
      <circle cx="770" cy="470" r="21" fill="#f2f7fb" fill-opacity=".14" />
      <circle cx="770" cy="470" r="21" stroke="#f2f7fb" stroke-opacity=".8" fill="none" stroke-width="2" />
      <circle cx="770" cy="470" r="8" fill="#f2f7fb" />
    </g>

    <!-- scale + coords, no invented figures -->
    <g font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#e7f0f7" fill-opacity=".45">
      <text x="310" y="836">-7.7956, 110.3695</text>
      <line x1="1160" y1="826" x2="1290" y2="826" stroke="#e7f0f7" stroke-opacity=".45" stroke-width="2" />
      <line x1="1160" y1="820" x2="1160" y2="832" stroke="#e7f0f7" stroke-opacity=".45" stroke-width="2" />
      <line x1="1290" y1="820" x2="1290" y2="832" stroke="#e7f0f7" stroke-opacity=".45" stroke-width="2" />
      <text x="1225" y="814" text-anchor="middle">500 m</text>
    </g>

    <!-- map controls -->
    <g>
      <rect x="1256" y="112" width="34" height="68" rx="8" fill="#101e2a" fill-opacity=".9" stroke="#e7f0f7" stroke-opacity=".18" />
      <path d="M1273 126v22M1262 137h22" stroke="#e7f0f7" stroke-opacity=".7" stroke-width="2" />
      <path d="M1262 165h22" stroke="#e7f0f7" stroke-opacity=".7" stroke-width="2" />
      <circle cx="1273" cy="212" r="17" fill="#101e2a" fill-opacity=".9" stroke="#e7f0f7" stroke-opacity=".18" />
      <path d="M1273 203v18M1264 212h18" stroke="#5aa9dd" stroke-width="2" />
    </g>
  </g>
  <rect x="286" y="86" width="1030" height="768" fill="none" stroke="#e7f0f7" stroke-opacity=".14" />

  <!-- right inspector panel -->
  <rect x="1316" y="66" width="284" height="834" fill="#101e2a" />
  <line x1="1316" y1="66" x2="1316" y2="900" stroke="#e7f0f7" stroke-opacity=".14" />

  <text x="1342" y="112" fill="#5aa9dd" font-size="11" letter-spacing="2.6" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace">PANEL AI · SIMPUL</text>
  <text x="1342" y="146" fill="#f2f7fb" font-size="20">Stasiun Tugu</text>
  <text x="1342" y="170" fill="#e7f0f7" fill-opacity=".5" font-size="12" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace">SIMPUL ANTARMODA</text>

  <line x1="1342" y1="192" x2="1574" y2="192" stroke="#e7f0f7" stroke-opacity=".14" />

  <text x="1342" y="224" fill="#e7f0f7" fill-opacity=".45" font-size="11" letter-spacing="2.4" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace">RINGKASAN</text>
  <g fill="#e7f0f7" fill-opacity=".72" font-size="13">
    <text x="1342" y="250">Terhubung kereta dan bus kota,</text>
    <text x="1342" y="272">tetapi jalur pejalan kaki di sisi</text>
    <text x="1342" y="294">timur terputus sebelum halte.</text>
  </g>

  <text x="1342" y="336" fill="#e7f0f7" fill-opacity=".45" font-size="11" letter-spacing="2.4" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace">DIMENSI TOD</text>
  <!-- qualitative bars: no numeric labels -->
  <g>
    <text x="1342" y="364" fill="#e7f0f7" fill-opacity=".7" font-size="12.5">Kepadatan</text>
    <rect x="1342" y="372" width="232" height="6" rx="3" fill="#e7f0f7" fill-opacity=".14" />
    <rect x="1342" y="372" width="176" height="6" rx="3" fill="#5aa9dd" />

    <text x="1342" y="404" fill="#e7f0f7" fill-opacity=".7" font-size="12.5">Keterhubungan</text>
    <rect x="1342" y="412" width="232" height="6" rx="3" fill="#e7f0f7" fill-opacity=".14" />
    <rect x="1342" y="412" width="150" height="6" rx="3" fill="#5aa9dd" />

    <text x="1342" y="444" fill="#e7f0f7" fill-opacity=".7" font-size="12.5">Kualitas pedestrian</text>
    <rect x="1342" y="452" width="232" height="6" rx="3" fill="#e7f0f7" fill-opacity=".14" />
    <rect x="1342" y="452" width="72" height="6" rx="3" fill="#c2603a" />

    <text x="1342" y="484" fill="#e7f0f7" fill-opacity=".7" font-size="12.5">Peneduh</text>
    <rect x="1342" y="492" width="232" height="6" rx="3" fill="#e7f0f7" fill-opacity=".14" />
    <rect x="1342" y="492" width="94" height="6" rx="3" fill="#d2704a" />
  </g>

  <text x="1342" y="546" fill="#e7f0f7" fill-opacity=".45" font-size="11" letter-spacing="2.4" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace">PALING PERLU DIBENAHI</text>
  <g font-size="12.5">
    <circle cx="1348" cy="572" r="4" fill="#c2603a" />
    <text x="1362" y="576" fill="#e7f0f7" fill-opacity=".72">Trotoar terputus, sisi timur</text>
    <circle cx="1348" cy="600" r="4" fill="#c2603a" />
    <text x="1362" y="604" fill="#e7f0f7" fill-opacity=".72">Penyeberangan tanpa pelindung</text>
    <circle cx="1348" cy="628" r="4" fill="#d2704a" />
    <text x="1362" y="632" fill="#e7f0f7" fill-opacity=".72">Peneduh minim menuju halte</text>
  </g>

  <!-- survey thumbnails -->
  <text x="1342" y="678" fill="#e7f0f7" fill-opacity=".45" font-size="11" letter-spacing="2.4" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace">FOTO SURVEI</text>
  <g>
    <rect x="1342" y="692" width="72" height="90" rx="6" fill="#17293a" stroke="#e7f0f7" stroke-opacity=".16" />
    <rect x="1342" y="752" width="72" height="30" rx="0" fill="#4a4a4c" />
    <rect x="1422" y="692" width="72" height="90" rx="6" fill="#17293a" stroke="#e7f0f7" stroke-opacity=".16" />
    <rect x="1422" y="746" width="72" height="36" fill="#5b7a3c" fill-opacity=".6" />
    <rect x="1502" y="692" width="72" height="90" rx="6" fill="#17293a" stroke="#e7f0f7" stroke-opacity=".16" />
    <rect x="1502" y="758" width="72" height="24" fill="#8d8577" fill-opacity=".7" />
  </g>

  <rect x="1342" y="808" width="232" height="40" rx="20" fill="none" stroke="#e7f0f7" stroke-opacity=".28" />
  <text x="1458" y="833" fill="#e7f0f7" font-size="13" text-anchor="middle">Lihat laporan simpul</text>
</svg>
